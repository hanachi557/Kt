<script>
const input=document.getElementById("usd"),result=document.getElementById("result");
function calc(){
 const v=Number(input.value);
 if(!Number.isFinite(v)||v<=0){result.classList.remove("show");return;}
 
 const low=Math.ceil((v*33*1.3)/10)*10;
 const high=Math.ceil((v*33*1.4)/10)*10;
 document.getElementById("low").textContent="NT$ "+low.toLocaleString("zh-TW");
 document.getElementById("high").textContent="NT$ "+high.toLocaleString("zh-TW");
 result.classList.add("show");
}
document.getElementById("calc").addEventListener("click",calc);
input.addEventListener("input",()=>{if(input.value)calc();else result.classList.remove("show")});
</script>
